spring:
  application:
    name: gausscmp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/postgres?currentSchema=lotus}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:lotus}
    password: '${DB_PASSWORD:Lotus@7fK9mQ2xV8rN}'
  sql:
    init:
      mode: always
      continue-on-error: false
  jpa:
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          create_namespaces: true
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
  mail:
    # SMTP 服务器地址与端口（如 smtp.corp.com:465 SSL / :587 STARTTLS / :25 明文）
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    # 认证用户密码（MAIL_SMTP_AUTH=true 时必填）
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          # 是否启用用户密码认证
          auth: ${MAIL_SMTP_AUTH:false}
          # SSL 直连（465 端口典型）；与 STARTTLS 二选一
          ssl:
            enable: ${MAIL_SSL:false}
          # STARTTLS 升级（587 端口典型）；与 SSL 二选一
          starttls:
            enable: ${MAIL_STARTTLS:false}
          # 连接与读超时（毫秒），避免邮件故障阻塞比对任务
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}
metadata:
  collect:
    parallelism: 16
    # 每个数据源保留的历史快照数，0=永久保留
    history-retention: 0
# 邮件通知（比对结果发送给数据库维护人员）
notify:
  mail:
    # 总开关：false 时定时比对照常执行但不发邮件
    enabled: ${MAIL_ENABLED:false}
    # 发件人（通常需要与认证用户一致，否则可能被 SMTP 拒绝）
    from: ${MAIL_FROM:gausscmp@localhost}
    # 抄送人（逗号分隔，可空）；收件人由每个定时任务的"通知邮箱"配置
    cc: ${MAIL_CC:}
server:
  port: 8080
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
    algorithm: PBEWithMD5AndDES
    string-output-type: base64
logging:
  level:
    com.lotus.gausscmp: INFO
    com.lotus.gausscmp.concurrency: INFO
    org.springframework: WARN
    org.hibernate: INFO
    org.hibernate.tool.schema: DEBUG
